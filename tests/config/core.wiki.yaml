# 用这个站点插件的部署，config/core.wiki.yaml 写成这样（测试里也拿它当「一个阴阳师的部署」）。
# 各项的含义见核心仓库的 src/jianshanagent/defaults/core.wiki.yaml。

name: "阴阳师"                      # 提示词里用它：「你是阴阳师 wiki 机器人的查证员」
about: "网易手游"                   # 向模型交代背景时用（「阴阳师（网易手游）」）

api_url: "https://yys.huijiwiki.com/api.php"
site_base: "https://yys.huijiwiki.com"
# wiki 在 Cloudflare 后面，请求要带放行请求头才不会被挑战页拦截。
# 这里只写请求头名；密钥在 secrets.yaml 的 wiki.authkey（不入库）
auth_header: "X-authkey"

# 站点插件：阴阳师 wiki（jianshanagent-site-huiji-yys），它的上级灰机平台（jianshanagent-site-huiji）会先加载。
# 这一项和上面的地址都不能在管理后台里改，要改就改这个文件再发布。
site: yys
